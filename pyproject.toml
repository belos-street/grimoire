[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grimoire"
version = "1.0.0"
description = "Curated AI Agent skills, engineering conventions, and workflows, installable into .agents/skills via CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "belos-street" }]
keywords = ["cli", "skill", "agents", "ai", "workflow"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grimoire = "grimoire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["grimoire"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "grimoire/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
